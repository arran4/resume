name: Build Typst document

# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/042-simplified-github-ci-release-safe/
# Release safety details:
# https://arran4.github.io/blog/post/2026/041-release-safe-single-owner-github-ci/
# This repo intentionally uses an external-tag-only publisher path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      update_preview:
        description: "Commit the generated preview image directly to the default branch"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.preview_diff.outputs.changed }}
      ref: ${{ steps.tag.outputs.REF }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      publish: ${{ steps.validate.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Release Tag
        id: validate
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: .github/scripts/validate_tag.sh "$TAG_NAME"

      - name: Get Git reference
        id: tag
        run: |
          REF=${GITHUB_REF#refs/*/}
          REF=${REF//\//-}
          echo "REF=$REF" >> $GITHUB_ENV
          echo "REF=$REF" >> $GITHUB_OUTPUT

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Build resume and assets
        run: ./build.sh "Arran-Ubels-${{ env.REF }}"

      - name: Check for preview changes
        id: preview_diff
        run: |
          if git diff --quiet -- assets/resume-preview.png; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-${{ env.REF }}
          retention-days: 5
          path: |
            Arran-Ubels-${{ env.REF }}.pdf
            Arran-Ubels-${{ env.REF }}-page-*.png
            assets/resume-preview.png
          include-hidden-files: true

  update-preview:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_preview == 'true' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-${{ needs.build.outputs.ref }}
          path: .
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only
          git add assets/resume-preview.png
          git commit -m "Update preview image for ${{ needs.build.outputs.ref }}"
          git push

  create-preview-pr:
    needs: [build]
    if: github.ref_type == 'tag' && needs.build.outputs.changed == 'true' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-${{ needs.build.outputs.ref }}
          path: .
      - name: Create Pull Request for preview image
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/preview-image-update-${{ needs.build.outputs.ref }}
          title: "Update preview image for ${{ needs.build.outputs.ref }}"
          commit-message: "Update preview image for ${{ needs.build.outputs.ref }}"
          body: |
            Automated update of resume preview image for version ${{ needs.build.outputs.ref }}.
            Generated from tag `${{ needs.build.outputs.ref }}`.
          base: main
          add-paths: |
            assets/resume-preview.png

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-${{ needs.build.outputs.ref }}
          path: .
      - name: Install poppler-utils (for pdfinfo)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify expected release assets exist
        id: verify_assets
        run: |
          MANIFEST=$(.github/scripts/verify_assets.sh "${{ needs.build.outputs.ref }}")
          # Store the multiline manifest to an output so it can be passed to the release action exactly
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "manifest<<$EOF" >> $GITHUB_OUTPUT
          echo "$MANIFEST" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ needs.build.outputs.ref }}"
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.verify_assets.outputs.manifest }}
